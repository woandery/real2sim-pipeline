[api]
# Set a vision-capable Responses model available to your API project.
model = "YOUR_VISION_MODEL"
# Optional: a separately configured visual reviewer.
# review_model = "YOUR_VISION_MODEL"
base_url = "https://api.openai.com/v1"
key_env = "OPENAI_API_KEY"
max_output_tokens = 24000
timeout_seconds = 600
# reasoning_effort = "high"

[sampling]
uniform_frames = 48
event_frames = 24
event_separation_seconds = 0.18
refinement_rounds = 2
frames_per_interval = 6
max_refinement_frames = 48

[review]
max_revisions = 4
passes_required = 2
require_human_approval = true

[runtime]
# Absolute executable path is recommended on the GPU host.
python = "/path/to/isaac-sim/python.sh"
device_lock = "~/.cache/video-real2sim/gpu.lock"
timeout_seconds = 3600
# Set true after accepting NVIDIA's terms in your own Isaac installation.
accept_eula = false
max_penetration_m = 0.001
max_rest_translation_m = 0.01
max_rest_rotation_deg = 10
